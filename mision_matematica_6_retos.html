<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misión Matemática · 6 retos</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#19283a;background:white}*{box-sizing:border-box}body{margin:0}header{padding:20px max(16px,calc((100vw - 850px)/2));border-bottom:2px solid #dce7f1;background:#f7fbff}h1{font-size:clamp(24px,4vw,34px);margin:0}h2{font-size:23px}main{max-width:850px;margin:auto;padding:20px 14px 60px}.muted{color:#516478}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:12px}.card{border:1px solid #d7e1eb;border-radius:14px;padding:19px;margin:14px 0;background:white}.tile{text-align:left;min-height:125px}.tile b{display:block;font-size:19px;margin-bottom:7px}.tile span{font-size:14px;color:#526579}button{font:inherit;border:1px solid #9db2c7;background:white;border-radius:10px;padding:12px 16px;cursor:pointer;min-height:46px}button:hover{background:#eef6fd}button:focus-visible,input:focus-visible{outline:3px solid #3380c2}button.primary{background:#175f9e;color:white;border-color:#175f9e}button.primary:hover{background:#104a7d}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.actions button{flex:1}.step{display:inline-block;padding:5px 10px;background:#e8f3ff;border-radius:20px;font-size:13px;font-weight:700}.expression{font-size:clamp(24px,5vw,35px);font-weight:700;text-align:center;padding:18px;background:#f3f8fd;border-radius:12px;margin:15px 0}.example{background:#f5f8fc;border-left:4px solid #3778ac;padding:13px;line-height:1.7}.feedback{padding:12px;border-radius:8px;margin-top:12px;background:#eef5ff}.correct{background:#e9f6ee;color:#155c35}.wrong{background:#fff2ed;color:#8e321d}input{font:inherit;border:1px solid #9fb0c0;border-radius:9px;padding:12px;max-width:100%;width:220px;font-size:21px}label{display:block;font-weight:650;margin:13px 0 8px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin:14px 0}.choices button{font-size:18px}.choices button.selected{border:2px solid #175f9e;background:#e7f2fc}.bar{height:9px;background:#e9eef4;border-radius:20px;overflow:hidden}.bar div{height:100%;background:#1769ad}.numberline{display:flex;gap:7px;flex-wrap:wrap}.numberline span{border:1px solid #d2deea;padding:8px 11px;border-radius:7px;background:#f7fbff}.diagram{display:grid;grid-template-columns:repeat(var(--cols),26px);gap:4px;justify-content:center;margin:14px 0}.diagram i{width:26px;height:26px;background:#c5e2f5;border:1px solid #4d86ae;border-radius:3px}.small{font-size:14px}footer{text-align:center;color:#667;margin-top:20px;font-size:13px}@media(max-width:500px){main{padding:12px}.card{padding:15px}.actions button{flex-basis:100%}}
</style></head><body><header><h1>MISIÓN MATEMÁTICA</h1><div>Los 6 retos · Elige por dónde empezar</div></header><main id="app"></main><script>
'use strict';const app=document.getElementById('app');const missions=[
{name:'Multiplicaciones',desc:'Sumas repetidas y factores que faltan',example:'4 + 4 + 4 = 3 × 4 = 12.',items:[{kind:'sum',n:3,v:5},{kind:'mul',a:4,b:6},{kind:'missing',a:7,b:3},{kind:'sum',n:4,v:3},{kind:'mul',a:8,b:2},{kind:'missing',a:5,b:6},{kind:'sum',n:5,v:4},{kind:'mul',a:6,b:6}]},
{name:'Cuadrados',desc:'Multiplicar un número por sí mismo',example:'El cuadrado de 4 es 4 × 4 = 16. Se puede representar con 4 filas de 4 casillas.',items:[2,3,5,4,6,7,8,9].map(n=>({kind:'square',n}))},
{name:'Operaciones combinadas',desc:'Resolver cada operación en su orden',example:'(5 + 3) × 2 → primero 5 + 3 = 8; después 8 × 2 = 16.',items:[{kind:'op',steps:[['(7 + 2) × 3','7 + 2',9],['9 × 3','9 × 3',27]]},{kind:'op',steps:[['6 × 4 + 5','6 × 4',24],['24 + 5','24 + 5',29]]},{kind:'op',steps:[['(18 − 6) ÷ 3','18 − 6',12],['12 ÷ 3','12 ÷ 3',4]]},{kind:'op',steps:[['30 − 4 × 5','4 × 5',20],['30 − 20','30 − 20',10]]},{kind:'op',steps:[['(9 + 3) × 2','9 + 3',12],['12 × 2','12 × 2',24]]},{kind:'op',steps:[['7 × 3 − 8','7 × 3',21],['21 − 8','21 − 8',13]]},{kind:'op',steps:[['(16 − 4) ÷ 2','16 − 4',12],['12 ÷ 2','12 ÷ 2',6]]},{kind:'op',steps:[['5 + 18 ÷ 3','18 ÷ 3',6],['5 + 6','5 + 6',11]]}]},
{name:'Divisores',desc:'Comprobar divisiones exactas',example:'3 es divisor de 15 porque 15 ÷ 3 = 5 y el resto es 0.',items:[{kind:'divisor',a:4,b:28},{kind:'divisor',a:6,b:32},{kind:'divisor',a:5,b:45},{kind:'divisor',a:7,b:42},{kind:'divisor',a:8,b:30},{kind:'divisor',a:3,b:26},{kind:'divisor',a:9,b:54},{kind:'divisor',a:4,b:22}]},
{name:'Múltiplos',desc:'Series y relaciones entre números',example:'Los primeros múltiplos positivos de 6 son 6, 12, 18, 24… Se obtienen multiplicando por 1, 2, 3, 4…',items:[{kind:'series',n:4,k:4},{kind:'multiple',a:6,b:42},{kind:'series',n:7,k:3},{kind:'multiple',a:5,b:32},{kind:'series',n:9,k:5},{kind:'multiple',a:8,b:48},{kind:'series',n:3,k:6},{kind:'multiple',a:4,b:26}]},
{name:'Divisiones',desc:'Cociente, resto y problemas de reparto',example:'17 ÷ 5 = 3 y sobran 2. El cociente es 3 y el resto es 2. Comprueba: 5 × 3 + 2 = 17.',items:[{kind:'division',a:27,b:4},{kind:'division',a:36,b:6},{kind:'story',a:23,b:5,obj:'cuadernos',rec:'estantes'},{kind:'division',a:38,b:7},{kind:'story',a:32,b:6,obj:'balones',rec:'cajas'},{kind:'division',a:45,b:9},{kind:'story',a:29,b:4,obj:'pegatinas',rec:'sobres'},{kind:'division',a:50,b:8}]}];
let m=-1,q=0,sub=0,errors=0,selected=null,feedback='',passed=false;const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');function menu(){m=-1;app.innerHTML='<section class="card"><h2>Elige una misión</h2><p>Puedes empezar por cualquiera de los seis retos y repetirlos tantas veces como quieras. Lee cada ejemplo antes de responder.</p><div class="grid">'+missions.map((x,i)=>`<button class="tile" onclick="start(${i})"><b>${i+1}. ${x.name}</b><span>${x.desc}</span></button>`).join('')+'</div></section><footer>Practica a tu ritmo. No se solicitan datos personales ni se guardan resultados en internet.</footer>'}
function start(i){m=i;q=0;sub=0;errors=0;selected=null;feedback='';passed=false;render()}function item(){return missions[m].items[q]}function setFeedback(msg,good=false){feedback=`<div class="feedback ${good?'correct':'wrong'}" role="status">${msg}</div>`;document.getElementById('fb').innerHTML=feedback}function select(v){selected=v;document.querySelectorAll('.choices button').forEach(b=>b.classList.toggle('selected',b.dataset.value===String(v)))}function answer(v){const x=document.getElementById('answer');if(x)x.value=v}function numeric(){let x=document.getElementById('answer');return x&&x.value.trim()!==''?Number(x.value):NaN}function check(expected){if(passed)return;if(numeric()===expected){passed=true;setFeedback('Correcto. Puedes continuar.',true);document.getElementById('next').hidden=false}else{errors++;setFeedback('Todavía no. Revisa la operación y vuelve a intentarlo.')}}function checkChoice(expected){if(passed)return;if(selected===null){setFeedback('Elige una opción.');return}if(String(selected)===String(expected)){passed=true;setFeedback('Correcto. Puedes continuar.',true);document.getElementById('next').hidden=false}else{errors++;setFeedback('Comprueba con una multiplicación o división y prueba otra vez.')}}function next(){if(!passed)return;const it=item();if(it.kind==='op'&&sub===0){sub=1;passed=false;feedback='';render();return}if(it.kind==='division'||it.kind==='story'){if(sub===0){sub=1;passed=false;feedback='';render();return}}q++;sub=0;passed=false;selected=null;feedback='';render()}
function hint(){const it=item();let h='';switch(it.kind){case'sum':h=`Cuenta cuántas veces se repite ${it.v}. Multiplica ${it.n} × ${it.v}.`;break;case'mul':h=`Puedes sumar ${it.b} un total de ${it.a} veces.`;break;case'missing':h=`¿Qué número multiplicado por ${it.a} da ${it.a*it.b}?`;break;case'square':h=`Multiplica ${it.n} × ${it.n}.`;break;case'op':h=sub===0?'Primero resuelve el paréntesis si lo hay. Si no, haz la multiplicación o división antes de sumar o restar.':'Utiliza el resultado del paso anterior para terminar la operación.';break;case'divisor':h=`Calcula ${it.b} ÷ ${it.a}. Si el resto es cero, sí es divisor.`;break;case'series':h=`Para el ${it.k}.º múltiplo calcula ${it.n} × ${it.k}.`;break;case'multiple':h=`Comprueba si ${it.b} ÷ ${it.a} tiene resto 0.`;break;default:h=sub===0?`Busca cuántos grupos completos de ${it.b} caben en ${it.a}.`:`Calcula ${it.a} − (${it.b} × ${Math.floor(it.a/it.b)}).`};setFeedback('Pista: '+h,true)}
function expression(s){return `<div class="expression">${s}</div>`}function numberInput(){return '<label for="answer">Escribe tu respuesta</label><input id="answer" type="number" inputmode="numeric" autocomplete="off" onkeydown="if(event.key===\'Enter\')submit()">'}function choices(){return '<div class="choices"><button data-value="si" onclick="select(\'si\')">Sí</button><button data-value="no" onclick="select(\'no\')">No</button></div>'}function submit(){let it=item(),expected;switch(it.kind){case'sum':expected=it.n*it.v;break;case'mul':expected=it.a*it.b;break;case'missing':expected=it.b;break;case'square':expected=it.n*it.n;break;case'op':expected=it.steps[sub][2];break;case'series':expected=it.n*it.k;break;case'division':case'story':expected=sub===0?Math.floor(it.a/it.b):it.a%it.b;break;case'divisor':return checkChoice(it.b%it.a===0?'si':'no');case'multiple':return checkChoice(it.b%it.a===0?'si':'no')}check(expected)}
function render(){if(q===missions[m].items.length){app.innerHTML=`<section class="card"><h2>Misión completada</h2><p>Has resuelto los 8 ejercicios de <b>${missions[m].name}</b>.</p><p>Intentos incorrectos: ${errors}. Puedes repetir el reto para seguir practicando.</p><div class="actions"><button onclick="menu()">Elegir otra misión</button><button class="primary" onclick="start(${m})">Repetir misión</button></div></section>`;return}const it=item(),mission=missions[m];let question='';switch(it.kind){case'sum':question=`${expression(Array(it.n).fill(it.v).join(' + ')+' = ?')}<p>Escribe el resultado de la suma repetida.</p>${numberInput()}`;break;case'mul':question=`${expression(it.a+' × '+it.b+' = ?')}${numberInput()}`;break;case'missing':question=`${expression(it.a+' × □ = '+it.a*it.b)}<p>¿Qué número falta?</p>${numberInput()}`;break;case'square':question=`<p>Observa el cuadrado de ${it.n} filas y ${it.n} columnas.</p><div class="diagram" style="--cols:${it.n}">${'<i></i>'.repeat(it.n*it.n)}</div>${expression(it.n+' × '+it.n+' = ?')}${numberInput()}`;break;case'op':{let st=it.steps[sub];question=`${expression(sub===0?it.steps[0][0]:it.steps[1][0])}<span class="step">Paso ${sub+1} de 2</span><p>${sub===0?'Resuelve la operación que va primero.':'Termina la operación con el resultado anterior.'}</p>${expression(esc(st[1])+' = ?')}${numberInput()}`;break}case'divisor':question=`${expression('¿'+it.a+' es divisor de '+it.b+'?')}<p>Piensa si ${it.b} se puede dividir entre ${it.a} sin que sobre nada.</p>${choices()}`;break;case'multiple':question=`${expression('¿'+it.b+' es múltiplo de '+it.a+'?')}<p>Comprueba si se obtiene al multiplicar ${it.a} por un número natural.</p>${choices()}`;break;case'series':question=`<p>Completa el ${it.k}.º múltiplo positivo de ${it.n}.</p><div class="numberline">${Array.from({length:it.k},(_,i)=>`<span>${i===it.k-1?'?':it.n*(i+1)}</span>`).join('')}</div>${numberInput()}`;break;case'division':question=`${expression(it.a+' ÷ '+it.b)}<span class="step">${sub===0?'Paso 1: cociente':'Paso 2: resto'}</span><p>${sub===0?'¿Cuántas veces cabe '+it.b+' en '+it.a+'?':'¿Cuánto sobra después de repartir en grupos de '+it.b+'?'}</p>${numberInput()}`;break;case'story':question=`<p>Hay <b>${it.a} ${it.obj}</b> para repartir por igual entre <b>${it.b} ${it.rec}</b>.</p>${expression(it.a+' ÷ '+it.b)}<span class="step">${sub===0?'Paso 1: cociente':'Paso 2: resto'}</span><p>${sub===0?'¿Cuántos '+it.obj+' recibe cada '+it.rec.slice(0,-1)+'?':'¿Cuántos '+it.obj+' sobran?'}</p>${numberInput()}`;break}
app.innerHTML=`<div class="actions"><button onclick="menu()">Volver a las misiones</button></div><section class="card"><span class="step">Misión ${m+1} · Ejercicio ${q+1} de 8</span><h2>${mission.name}</h2><div class="bar"><div style="width:${q/8*100}%"></div></div>${q===0&&sub===0?`<div class="example"><b>Antes de empezar:</b><br>${mission.example}</div>`:''}${question}<div id="fb" aria-live="polite">${feedback}</div><div class="actions"><button onclick="hint()">Ver una pista</button><button class="primary" onclick="submit()">Comprobar</button><button id="next" onclick="next()" ${passed?'':'hidden'}>Continuar</button></div></section><p class="small muted">Puedes cambiar de misión cuando quieras. Los resultados no se envían ni se guardan.</p>`;}
menu();
</script></body></html>
